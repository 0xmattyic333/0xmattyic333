# Redraws the contribution "snake" in neon colors once a day and publishes it
# to the `output` branch, which the README's <img> points at.
name: Generate neon snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:      # plus a manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dots: no contributions -> most contributions, in the portfolio's blue/violet.
          outputs: |
            dist/snake-neon.svg?color_snake=#a78bfa&color_dots=#161b33,#1e3a8a,#2563eb,#3b82f6,#60a5fa

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
